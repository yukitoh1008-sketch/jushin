<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>記録映像 QR</title>
<style>
  html, body { margin: 0; background: #fff; color: #111; font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
  #qr svg { width: min(80vw, 480px); height: auto; display: block; }
  .url { margin-top: 12px; font-size: 12px; color: #666; word-break: break-all; text-align: center; }
  button { margin-top: 16px; font: inherit; padding: 8px 18px; }
  @media print { button, .url { display: none; } body { padding-top: 0; } }
</style>
</head>
<body>
  <div id="qr"></div>
  <div class="url" id="url"></div>
  <button onclick="window.print()">印刷する</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  // この QR は動画のページ（同じフォルダの index.html）だけを指す
  var url = new URL('./', location.href).href;
  var q = qrcode(0, 'M');
  q.addData(url);
  q.make();
  document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 10, margin: 4, scalable: true });
  document.getElementById('url').textContent = url;
</script>
</body>
</html>
