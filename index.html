<title>呪信 整理券</title>
<script>
// google.script.run の代わり：Apps Script の doPost に {fn, args} を送る。
// Content-Type を text/plain にすると事前確認（preflight）なしで送れ、Cookie も送らないので
// Google アカウントの振り分け（/u/1/）が起きない。
(function () {
  var API = "https://script.google.com/macros/s/AKfycbzRKDApjYTfVgkaTHaLrgcdATwFRJlwmp2W72G5RO4smaGrXH61A9HH4RbDWYgZ1Q1R/exec";
  function call(fn, args, ok, ng) {
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('サーバーの応答が ' + r.status + ' でした'); return r.json(); })
      .then(function (j) { if (j.ok) { ok && ok(j.result); } else { ng && ng(new Error(j.error)); } })
      .catch(function (e) { ng && ng(new Error(e && e.message === 'Failed to fetch' ? '通信できませんでした。電波を確認してください' : (e && e.message) || String(e))); });
  }
  function runner(ok, ng) {
    var o = {
      withSuccessHandler: function (f) { return runner(f, ng); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    ['getPublic', 'issueTicket', 'cancelTicket', 'staffGet', 'staffSet', 'staffIssue', 'staffSetOpen', 'staffSetDelay', 'staffPractice'].forEach(function (fn) {
      o[fn] = function () { call(fn, Array.prototype.slice.call(arguments), ok, ng); };
    });
    return o;
  }
  window.google = { script: { run: runner() } };
})();
</script>

  button:disabled { opacity: .45; cursor: default; }

  .ticket { position: relative; background: linear-gradient(160deg, #0f2a2c, #0f1519 55%, #2a0f16); border: 2px solid var(--teal); text-align: center; padding: 16px; }
  .ticket .head { display: flex; justify-content: space-between; font-size: 11px; color: var(--teal); border-bottom: 1px dashed #35d0bf55; padding-bottom: 6px; margin-bottom: 10px; }
  .ticket .lbl { font-size: 12px; color: var(--muted); letter-spacing: .2em; }
  .ticket .no { font-family: "Share Tech Mono", ui-monospace, Consolas, monospace; font-size: 68px; line-height: 1.05; letter-spacing: .04em; }
  .ticket .time { font-size: 28px; font-weight: bold; color: var(--teal); }
  .ticket .meta { display: flex; justify-content: center; gap: 18px; margin-top: 8px; font-size: 15px; color: var(--muted); }
  .ticket .meta b { color: var(--text); font-size: 20px; }
  .ticket .msg { margin-top: 14px; padding: 12px; border-radius: 10px; background: #00000040; font-size: 16px; font-weight: bold; }
  .ticket.soon { border-color: var(--gold); animation: pulse 1.4s ease-in-out infinite; }
  .ticket.soon .msg { background: var(--gold); color: #1a1200; font-size: 19px; }
  .ticket.done { border-color: var(--green); }
  .ticket.void { border-color: var(--gray); opacity: .9; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 #ffcc4d00; } 50% { box-shadow: 0 0 0 8px #ffcc4d55; } }
  .stat { display: flex; justify-content: space-between; gap: 12px; }
  .stat div { flex: 1; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  /* スタッフ */
  .tabs { display: flex; gap: 6px; margin: 8px 0; }
  .tabs button.on { background: var(--text); color: var(--bg); }
  .slot { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  .slot.now { background: #3a1520; border-radius: 8px; }
  .slot .t { font-weight: bold; font-size: 16px; width: 46px; }

  .slot .info { flex: 1 1 110px; }

  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: bold; white-space: nowrap; }

  input[type=password], input[type=tel], input[type=text] { font: inherit; font-size: 22px; padding: 12px; width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #000; color: var(--text); letter-spacing: .2em; text-align: center; }

  /* 呼び出し画面 */

  .call-now { text-align: center; }
  .call-now .label { font-size: 3.2vw; color: var(--muted); }
  .call-now .big { font-size: 13vw; font-weight: 900; line-height: 1; margin: 2vh 0; }
  .call-now .time { font-size: 5vw; color: var(--teal); font-weight: bold; }
  .call-title { font-family: "Shippori Mincho B1", "Yu Mincho", serif; font-weight: 800; font-size: 5vw; letter-spacing: .15em; text-shadow: 0 0 2vw #e0213f99, .3vw 0 0 #e0213f88; margin-bottom: 2vh; }
  .poster-title { font-family: "Shippori Mincho B1", "Yu Mincho", "Hiragino Mincho ProN", serif; font-weight: 800; font-size: 96px; letter-spacing: .15em; padding-left: .15em; line-height: 1.1; color: #111; }
  .poster-sub { font-size: 18px; color: #444; letter-spacing: .1em; }
  .call-side { background: var(--card); border-radius: 2vw; padding: 3vw; text-align: center; }
  .call-side .next { font-size: 3.2vw; font-weight: bold; line-height: 1.5; }
  .call-side .muted { font-size: 1.7vw; margin: .5vh 0; }
  .call-side .qr svg { width: 100%; max-width: 24vw; height: auto; background: #fff; border-radius: 1vw; }
  @media (orientation: portrait) {
    body.page-call #app { grid-template-columns: 1fr; }
    .call-now .label { font-size: 5vw; } .call-now .big { font-size: 24vw; } .call-now .time { font-size: 9vw; }

  /* ポスター（印刷用） */

<body>
<div id="app"><p class="muted center" style="color:#8ea5ac;text-align:center">読み込み中…</p></div>
<script>
// どのスマホで何が起きたか分かるように、エラーはそのまま画面に出す
window.onerror = function (msg, src, line) {
  var el = document.getElementById('app');
  if (!el) return;
  var box = document.createElement('div');
  box.style.cssText = 'margin:12px 0;padding:12px;border:1px solid #e0213f;border-radius:10px;background:#3a0f18;color:#ffd0d7;font-size:13px;word-break:break-all';
  box.textContent = 'エラー：' + msg + '（' + (line || '?') + '行目）　' + navigator.userAgent;
  el.insertBefore(box, el.firstChild);
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
var BOOT = (function () {
  var p = (location.search.match(/[?&]p=([a-z]+)/) || [])[1] || '';
  var pages = { staff: 1, call: 1, poster: 1 };
  var titles = { staff: '整理券（スタッフ）', call: '呼び出し', poster: '整理券ポスター' };
  if (titles[p]) document.title = "呪信" + ' ' + titles[p];
  return { page: pages[p] ? p : 'ticket', url: location.origin + location.pathname, name: "呪信", subtitle: "旧校舎・脳科学研究室　被験者受付", v: "1.5.0" };
})();
var $app = document.getElementById('app');

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ng) {
    if (!window.google || !google.script || !google.script.run) {
      ng(new Error('サーバーにつなぐ部品（google.script）が読み込めませんでした'));
      return;
    }
    // 返事がないまま固まらないように、20秒で打ち切って画面に出す
    var timer = setTimeout(function () { ng(new Error('サーバーから20秒返事がありません')); }, 20000);
    var r = google.script.run.withSuccessHandler(function (v) { clearTimeout(timer); ok(v); }).withFailureHandler(function (e) {
      clearTimeout(timer);
      ng(new Error(String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '')));
    });
    r[fn].apply(r, args);
  });
}
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function qrSvg(text) {
  if (typeof qrcode !== 'function') return '<p class="muted">QRコードを読み込めませんでした</p>';
  var q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  return q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
}
function versionBanner(v) {
  return v && v !== BOOT.v ? '<div class="banner">新しい版があります。<a href="#" onclick="location.reload();return false">ページを読み込み直す</a></div>' : '';
}
// GAS の画面は iframe の中なので confirm() / alert() が出ないことがある。ページの中に出す
function dialog(msg, buttons) {
  var el = document.createElement('div');
  el.className = 'modal';
  el.style.zIndex = 20;
  el.innerHTML = '<div class="card"><p style="white-space:pre-line;font-size:16px">' + esc(msg) + '</p><div class="row" style="flex-wrap:nowrap"></div></div>';
  var row = el.querySelector('.row');
  buttons.forEach(function (b) {
    var btn = document.createElement('button');
    btn.textContent = b.label;
    btn.className = b.primary ? 'primary' : '';
    btn.style.flex = '1';
    btn.onclick = function () { document.body.removeChild(el); if (b.fn) b.fn(); };
    row.appendChild(btn);
  });
  document.body.appendChild(el);
}
function askYes(msg, yes) { dialog(msg, [{ label: 'はい', primary: true, fn: yes }, { label: 'やめる' }]); }
function tell(msg) { dialog(msg, [{ label: 'OK', primary: true }]); }
function busyOn(on) {
  var el = document.getElementById('busy');
  if (!el) {
    el = document.createElement('div');
    el.id = 'busy';
    el.textContent = '送信中…';
    el.style.cssText = 'position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#ffcc4d;color:#1a1200;font-weight:bold;padding:8px 18px;border-radius:99px;z-index:30;display:none;box-shadow:0 4px 16px #0008';
    document.body.appendChild(el);
  }
  el.style.display = on ? 'block' : 'none';
}
function brand(name, sub, now) {
  return '<div class="brand">' +
    '<div class="lab">BRAIN SCIENCE LAB / SUBJECT RECEPTION</div>' +
    '<div class="title">' + esc(name) + '</div>' +
    (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
    (now ? '<div class="sub mono" style="font-size:11px;margin-top:2px">' + esc(now) + ' 現在</div>' : '') + '</div>';
}
function every(ms, fn) {
  fn();
  var id = setInterval(fn, ms);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) fn(); });
  return id;
}

// ───────── お客さん ─────────

var T = { data: null, people: null, pick: null, busy: false, err: '', hide: store.get('obake-hide') || '', buzzed: '', loadErr: '' };
var DEVICE = store.get('obake-device');
if (!DEVICE) {
  DEVICE = '';
  var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  for (var i = 0; i < 24; i++) DEVICE += chars[Math.floor(Math.random() * chars.length)];
  store.set('obake-device', DEVICE);
}

function loadTicket() {
  return api('getPublic', DEVICE).then(function (d) {
    T.data = d; T.loadErr = '';
    if (d.mine) store.set('obake-last', JSON.stringify(d.mine));
    if (T.pick && !d.free.some(function (f) { return String(f.no) === String(T.pick); })) T.pick = null;
    renderTicket();
  }).catch(function (e) { T.loadErr = e.message; renderTicket(); });
}

function ticketCard(m, d) {
  var cls = 'ticket card', msg = '', extra = '';
  if (m.status === '発券済' && !m.expired) {
    var soon = m.minutesLeft <= Math.min(5, d.interval);
    if (soon) {
      cls += ' soon';
      msg = m.minutesLeft >= 0 ? 'まもなく実験開始です。入口へお越しください' : '実験の時間です。入口のスタッフにこの画面を見せてください';
      if (T.buzzed !== String(m.no) && navigator.vibrate) { navigator.vibrate([300, 150, 300]); T.buzzed = String(m.no); }
    } else {
      msg = '実験開始まで 約' + m.minutesLeft + '分';
      msg += m.ahead ? '・前に ' + m.ahead + ' 組' : '';
    }
    extra = '<p class="muted">' + (soon ? 'この画面を入口のスタッフに見せてください。' : '時間になったら、この画面を入口のスタッフに見せてください。<br>それまでは他の展示を回っていて大丈夫です。') +
      '<br>念のためスクリーンショットしておくと安心です。</p>' +
      '<button class="ghost small" onclick="cancelMine(\'' + esc(m.no) + '\')">この整理券を取り消す</button>';
  } else if (m.status === '発券済') {
    cls += ' void';
    msg = '予定の時刻を過ぎました。入口のスタッフに声をかけてください';
    extra = '<button onclick="hideMine(\'' + esc(m.no) + '\')">新しく整理券を取る</button>';
  } else if (m.status === '入場済') {
    cls += ' done';
    msg = 'ご協力ありがとうございました。……あなたの記憶は、無事ですか？';
    extra = '<button onclick="hideMine(\'' + esc(m.no) + '\')">もう一度並ぶ</button>';
  } else {
    cls += ' void';
    msg = '時間内にお越しにならなかったため、この登録は無効になりました';
    extra = '<button onclick="hideMine(\'' + esc(m.no) + '\')">新しく整理券を取る</button>';
  }
  return '<div class="' + cls + ' scan">' +
    '<div class="head mono"><span>SUBJECT REGISTRATION</span><span>被験者登録票</span></div>' +
    '<div class="lbl">被験者番号</div>' +
    '<div class="no">No.' + esc(m.no) + '</div>' +
    '<div class="time">' + esc(m.time) + ' 実験開始</div>' +
    (d.delay && m.eta && m.status === '発券済' && !m.expired
      ? '<div class="late">遅れのため <b>' + esc(m.eta) + 'ごろ</b> のご案内になります（約' + d.delay + '分遅れ）</div>' : '') +
    '<div class="meta"><span>人数 <b>' + esc(m.people) + '</b> 名</span><span>照合コード <b>' + esc(m.code) + '</b></span></div>' +
    '<div class="msg">' + esc(msg) + '</div>' +
    '<div style="margin-top:12px">' + extra + '</div></div>';
}

function renderTicket() {
  var d = T.data, h = '';
  h += brand(d ? d.name : BOOT.name, d ? d.subtitle : BOOT.subtitle, d ? d.now : '');
  if (!d) {
    var last = store.get('obake-last');
    if (T.loadErr) h += '<div class="card"><p class="err">' + esc(T.loadErr) + '</p><button onclick="loadTicket()">もう一度読み込む</button></div>';
    if (last) h += '<p class="muted">前回の整理券（電波が戻ると最新になります）</p>' + ticketCard(JSON.parse(last), { interval: 5 });
    if (!T.loadErr) h += '<p class="muted center">読み込み中…</p>';
    $app.innerHTML = h;
    return;
  }
  h += versionBanner(d.v);
  if (T.loadErr) h += '<p class="err">通信できませんでした（' + esc(T.loadErr) + '）。表示は少し前のものです。</p>';
  if (d.practice) h += '<div class="card notice center"><b>ただいま練習中です</b>（本番の整理券ではありません）</div>';
  if (d.delay) h += '<div class="card delay"><b>⚠ ただいま 約' + d.delay + '分 遅れています</b><br><span>整理券の時刻より、ご案内が約' + d.delay + '分あとになります。</span></div>';
  if (d.notice) h += '<div class="card notice">' + esc(d.notice) + '</div>';

  var m = d.mine && String(d.mine.no) !== T.hide ? d.mine : null;
  if (m) {
    h += ticketCard(m, d);
  } else if (!d.open) {
    h += '<div class="card center"><b>ただいま整理券の配布を休止しています</b><p class="muted">しばらくしてからもう一度お試しください。</p></div>';
  } else if (!d.remaining) {
    h += '<div class="card center"><b>本日の整理券はすべて配り終えました</b><p class="muted">たくさんのご来場ありがとうございました。</p></div>';
  } else {
    if (T.people === null) T.people = Math.min(2, d.maxPeople);
    if (!T.pick && d.free[0]) T.pick = d.free[0].no;
    h += '<div class="card">';
    h += '<div class="mono" style="color:var(--teal);font-size:11px;letter-spacing:.2em">SUBJECT ENTRY FORM ── 整理券</div>';
    h += '<h2 style="margin-top:6px">① 人数（最大 ' + d.maxPeople + ' 名）</h2><div class="chips">';
    for (var p = 1; p <= d.maxPeople; p++) h += '<button class="chip' + (p === T.people ? ' on' : '') + '" onclick="T.people=' + p + ';renderTicket()">' + p + '名</button>';
    h += '</div><h2>② 入る時間</h2><div class="chips">';
    d.free.forEach(function (f, i) {
      h += '<button class="chip' + (String(f.no) === String(T.pick) ? ' on' : '') + '" onclick="T.pick=\'' + esc(f.no) + '\';renderTicket()">' + esc(f.time) + (i === 0 ? '<br><span style="font-size:11px;font-weight:normal">いちばん早い</span>' : '') + '</button>';
    });
    h += '</div>';
    var sel = d.free.filter(function (f) { return String(f.no) === String(T.pick); })[0];
    h += '<p style="margin:18px 0 10px">' + (sel ? '<b>' + esc(sel.time) + ' の回</b>に <b>' + T.people + '名</b>で入ります。' : '') + '</p>';
    h += '<button class="primary" ' + (T.busy ? 'disabled' : '') + ' onclick="takeTicket()">' + (T.busy ? '登録中…' : '整理券を取る') + '</button>';
    if (T.err) h += '<p class="err">' + esc(T.err) + '</p>';
    h += '<p class="muted">時間になったら入口にお越しください。それまでは他の展示を回っていて大丈夫です。</p>';
    h += '</div>';
  }
  h += '<div class="card stat">' +
    '<div><span>ただいまご案内中</span><b>' + (d.serving ? esc(d.serving.time) + ' の回' : '―') + '</b></div>' +
    '<div><span>残りの整理券</span><b>' + d.remaining + ' 枠</b></div></div>';
  $app.innerHTML = h;
  showPv(!!m);
}

// 告知映像：整理券を持っている人だけに見せる。画面は15秒ごとに作り直すので、
// 再生が止まらないよう #app の外に1回だけ作って、出す／隠すだけにする
var PV_URL = 'https://yukitoh1008-sketch.github.io/jushin/jushin_pv.mp4';
function showPv(on) {
  var box = document.getElementById('pv');
  if (!on) {
    if (box) { box.style.display = 'none'; var v0 = box.querySelector('video'); if (v0) v0.pause(); }
    return;
  }
  if (!box) {
    box = document.createElement('div');
    box.id = 'pv';
    box.innerHTML = '<div class="card pv scan"><div class="head mono"><span>ARCHIVE FOOTAGE</span><span>待ち時間に</span></div>' +
      '<p style="margin:0 0 10px;font-weight:bold">『呪信』告知映像</p>' +
      '<video controls playsinline preload="metadata" src="' + PV_URL + '#t=0.1"></video>' +
      '<p class="muted" style="margin:8px 0 0">音が出ます。まわりに気をつけてご覧ください。</p></div>';
    $app.parentNode.insertBefore(box, $app.nextSibling);
  }
  box.style.display = '';
}

function takeTicket() {
  if (T.busy) return;
  T.busy = true; T.err = ''; renderTicket();
  api('issueTicket', DEVICE, T.people, T.pick).then(function () {
    T.busy = false; T.hide = ''; store.del('obake-hide'); T.pick = null;
    return loadTicket();
  }).catch(function (e) {
    T.busy = false; T.err = e.message; T.pick = null;
    return loadTicket();
  });
}
function cancelMine(no) {
  askYes('No.' + no + ' の整理券を取り消しますか？\n取り消すと、その時間は他のお客さんに回ります。', function () {
    busyOn(true);
    api('cancelTicket', DEVICE, no).then(function () { busyOn(false); store.del('obake-last'); loadTicket(); })
      .catch(function (e) { busyOn(false); tell(e.message); });
  });
}
function hideMine(no) {
  T.hide = String(no); store.set('obake-hide', T.hide); store.del('obake-last'); renderTicket();
}

// ───────── スタッフ ─────────

var A = { pin: store.get('obake-pin') || '', data: null, tab: 'soon', walk: null, err: '', issued: null, busy: false };

function renderLogin(msg) {
  $app.innerHTML = '<h1>👻 スタッフ画面</h1><div class="card"><p>スタッフの合言葉（6けた）を入れてください。<br><span class="muted">スプレッドシートの「設定」シートにあります。</span></p>' +
    '<input id="pin" type="tel" inputmode="numeric" autocomplete="off" value="">' +
    (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
    '<p><button class="primary" onclick="login()">開く</button></p></div>';
  var el = document.getElementById('pin');
  el.focus();
  el.addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
}
function login() {
  A.pin = document.getElementById('pin').value.trim();
  if (!A.pin) return;
  busyOn(true);
  loadStaff(true).then(function () { busyOn(false); });
}
function loadStaff(first) {
  if (!A.pin) return renderLogin('');
  return api('staffGet', A.pin).then(function (d) {
    store.set('obake-pin', A.pin);
    A.data = d; A.err = '';
    renderStaff();
  }).catch(function (e) {
    if (/合言葉/.test(e.message)) { store.del('obake-pin'); A.pin = ''; return renderLogin(first ? e.message : ''); }
    A.err = e.message; renderStaff();
  });
}
function staffAct(fn, args, ask) {
  if (ask) return askYes(ask, function () { staffAct(fn, args); });
  if (A.busy) return;
  A.busy = true; busyOn(true);
  api.apply(null, [fn, A.pin].concat(args)).then(function (r) {
    A.busy = false; busyOn(false);
    if (fn === 'staffIssue') { A.issued = r; A.walk = null; }
    return loadStaff();
  }).catch(function (e) { A.busy = false; busyOn(false); tell(e.message); loadStaff(); });
}
function setSt(no, st, ask) { staffAct('staffSet', [no, st], ask); }

function renderStaff() {
  var d = A.data;
  if (!d) { $app.innerHTML = '<p class="muted center">読み込み中…</p>'; return; }
  var h = '<h1>👻 スタッフ<small>' + esc(d.now) + ' 現在</small></h1>' + versionBanner(d.v);
  if (d.practice) h += '<div class="card notice"><b>練習中</b>：今は練習用の枠です。終わったら下の「本番の枠に戻す」を押してください（日付が変わると自動で戻ります）。</div>';
  if (A.err) h += '<p class="err">通信できませんでした：' + esc(A.err) + '</p>';

  var waiting = d.rows.filter(function (r) { return r.status === '発券済' && !r.expired; });
  var next = waiting[0];
  h += '<div class="card">';
  h += '<div class="stat"><div><span>ご案内中</span><b>' + (d.serving ? 'No.' + esc(d.serving.no) + '</b><span>' + esc(d.serving.time) + ' の回</span>' : '―</b>') + '</div>' +
       '<div><span>待っている組</span><b>' + waiting.length + ' 組</b></div><div><span>空き枠</span><b>' + d.remaining + '</b></div></div>';
  if (next) {
    h += '<h2>次に案内する組</h2><div class="row" style="justify-content:space-between">' +
      '<div><b style="font-size:22px">No.' + esc(next.no) + '</b>　' + esc(next.time) + '　' + esc(next.people) + '名　コード <b>' + esc(next.code) + '</b></div>' +
      '<div class="acts"><button class="go" onclick="setSt(\'' + esc(next.no) + '\',\'入場済\')">入場</button>' +
      '<button class="ng" onclick="setSt(\'' + esc(next.no) + '\',\'不在\',\'No.' + esc(next.no) + ' を不在にしますか？\')">不在</button></div></div>';
  }
  h += '</div>';

  h += '<div class="card row" style="justify-content:space-between"><div><b>お客さんの発券</b><br>' +
    (d.open ? '<span class="badge b-入場済">受付中</span>' : '<span class="badge b-不在">休止中</span>') + '</div>' +
    '<button onclick="staffAct(\'staffSetOpen\',[' + (!d.open) + '],\'' + (d.open ? 'お客さんの発券を止めますか？' : 'お客さんの発券を再開しますか？') + '\')">' + (d.open ? '発券を止める' : '発券を再開する') + '</button></div>';

  // 遅れ：押した値がすぐお客さんの画面と呼び出し画面に出る
  var lag = next ? d.nowMin - next.min : 0;
  var hint = lag > 0 ? Math.ceil(lag / 5) * 5 : 0;
  h += '<div class="card"><div class="row" style="justify-content:space-between"><b>遅れ</b>' +
    (d.delay ? '<span class="badge b-不在">いま 約' + d.delay + '分 遅れ</span>' : '<span class="badge b-入場済">予定どおり</span>') + '</div>' +
    '<p class="muted" style="margin:4px 0 8px">押すとすぐ、お客さんの整理券と呼び出し画面に「約○分遅れ」と出ます。追いついたら「なし」に戻してください。</p><div class="chips">';
  [0, 5, 10, 15, 20, 30, 45, 60].forEach(function (v) {
    h += '<button class="chip' + (v === d.delay ? ' on' : '') + '" onclick="staffAct(\'staffSetDelay\',[' + v + '])">' + (v ? v + '分' : 'なし') + '</button>';
  });
  h += '</div>';
  if (hint && hint !== d.delay) {
    h += '<p class="muted" style="margin:10px 0 0">目安：次の組（No.' + esc(next.no) + '・' + esc(next.time) + '）の予定から ' + lag + '分 過ぎています。' +
      '<button class="small" style="margin-left:6px" onclick="staffAct(\'staffSetDelay\',[' + hint + '])">' + hint + '分にする</button></p>';
  }
  h += '</div>';

  h += '<div class="card"><b>スマホがないお客さんの発券</b><p class="muted" style="margin:4px 0 8px">人数を押すと次の空き枠（' + (d.nextFree ? esc(d.nextFree.time) : 'なし') + '）で発券します。番号と時刻を紙に書いて渡してください。</p><div class="chips">';
  for (var p = 1; p <= d.maxPeople; p++) h += '<button class="chip" ' + (d.nextFree ? '' : 'disabled') + ' onclick="staffAct(\'staffIssue\',[' + p + ',\'\'])">' + p + '名</button>';
  h += '</div></div>';

  h += '<div class="tabs"><button class="small ' + (A.tab === 'soon' ? 'on' : '') + '" onclick="A.tab=\'soon\';renderStaff()">これから</button>' +
       '<button class="small ' + (A.tab === 'all' ? 'on' : '') + '" onclick="A.tab=\'all\';renderStaff()">すべて</button>' +
       '<button class="small ghost" style="margin-left:auto" onclick="loadStaff()">更新</button></div>';
  var list = d.rows.filter(function (r) {
    return A.tab === 'all' || r.min >= d.nowMin - 30 || (r.status === '発券済' && r.min >= d.nowMin - 60);
  });
  h += '<div class="card" style="padding:4px 8px">';
  list.forEach(function (r) {
    var isNow = r.min <= d.nowMin && d.nowMin < r.min + d.interval;
    var st = r.status || '空き';
    var no = esc(r.no), acts = '';
    if (r.status === '発券済') {
      acts = '<button class="small go" onclick="setSt(\'' + no + '\',\'入場済\')">入場</button>' +
        '<button class="small ng" onclick="setSt(\'' + no + '\',\'不在\')">不在</button>' +
        '<button class="small ghost" onclick="setSt(\'' + no + '\',\'\',\'No.' + no + ' の整理券を取り消して空きに戻しますか？\')">取消</button>';
    } else if (r.status === '入場済' || r.status === '不在') {
      acts = '<button class="small ghost" onclick="setSt(\'' + no + '\',\'発券済\')">戻す</button>';
    } else if (r.status === '休止') {
      acts = '<button class="small ghost" onclick="setSt(\'' + no + '\',\'\')">解除</button>';
    } else {
      acts = '<button class="small" onclick="A.walk=\'' + no + '\';renderStaff()">発券</button>' +
        '<button class="small ghost" onclick="setSt(\'' + no + '\',\'休止\')">休止</button>';
    }
    h += '<div class="slot' + (isNow ? ' now' : '') + '"><div class="t">' + esc(r.time) + '</div><div class="n">No.' + no + '</div>' +
      '<div class="info"><span class="badge b-' + esc(st) + '">' + esc(st) + (r.expired ? '・時間切れ' : '') + '</span>' +
      (r.people ? ' ' + esc(r.people) + '名 <b>' + esc(r.code) + '</b>' + (r.by === 'スタッフ' ? ' <span class="muted">紙</span>' : '') : '') + '</div>' +
      '<div class="acts">' + acts + '</div></div>';
  });
  if (!list.length) h += '<p class="muted center">表示する枠がありません</p>';
  h += '</div>';

  h += '<div class="card"><b>練習</b><p class="muted" style="margin:4px 0 8px">営業時間外でも QR から発券を試せるように、今から2時間ぶんの枠を作ります。どちらのボタンも、出ている整理券はすべて消えます。</p>' +
    (d.practice
      ? '<button onclick="staffAct(\'staffPractice\',[false],\'本番の枠（設定の時刻）に戻しますか？練習の整理券はすべて消えます。\')">本番の枠に戻す</button>'
      : '<button onclick="staffAct(\'staffPractice\',[true],\'今から2時間の練習用の枠を作りますか？今の枠と整理券はすべて消えます（本番の日にはやらないでください）。\')">練習用の枠を作る</button>') +
    '</div>';

  h += '<p class="muted">ほかのページ：<a href="' + esc(BOOT.url) + '" target="_blank">お客さん用</a>　<a href="' + esc(BOOT.url) + '?p=call" target="_blank">呼び出し画面</a>　<a href="' + esc(BOOT.url) + '?p=poster" target="_blank">掲示用ポスター</a></p>';
  h += '<p class="muted"><a href="#" onclick="store.del(\'obake-pin\');A.pin=\'\';renderLogin(\'\');return false">この端末からログアウト</a></p>';

  if (A.walk) {
    h += '<div class="modal" onclick="if(event.target===this){A.walk=null;renderStaff()}"><div class="card"><b>No.' + esc(A.walk) + ' で発券</b><p class="muted">人数を選んでください</p><div class="chips">';
    for (var q = 1; q <= d.maxPeople; q++) h += '<button class="chip" onclick="staffAct(\'staffIssue\',[' + q + ',\'' + esc(A.walk) + '\'])">' + q + '名</button>';
    h += '</div><p><button class="ghost" onclick="A.walk=null;renderStaff()">やめる</button></p></div></div>';
  }
  if (A.issued) {
    var t = A.issued;
    h += '<div class="modal"><div class="card ticket"><div class="muted">発券しました。紙に書いて渡してください</div>' +
      '<div class="no">No.' + esc(t.no) + '</div><div class="time">' + esc(t.time) + ' の回</div>' +
      '<div class="meta"><span>人数 <b>' + esc(t.people) + '</b> 名</span><span>確認コード <b>' + esc(t.code) + '</b></span></div>' +
      '<p><button class="primary" onclick="A.issued=null;renderStaff()">閉じる</button></p></div></div>';
  }
  $app.innerHTML = h;
}

// ───────── 呼び出し画面 ─────────

function renderCall(d) {
  var next = d.next.filter(function (n) { return !d.serving || n.no !== d.serving.no; });
  $app.innerHTML =
    '<div class="call-now">' + versionBanner(d.v) +
      '<div class="call-title">' + esc(d.name) + '</div>' +
      '<div class="label">ただいまご案内中の被験者</div>' +
      (d.serving ? '<div class="big mono">No.' + esc(d.serving.no) + '</div><div class="time">' + esc(d.serving.time) + ' の回の方</div>'
                 : '<div class="big" style="font-size:8vw">まもなく開始</div>') +
      (d.delay ? '<div class="call-delay">ただいま 約' + d.delay + '分 遅れています</div>' : '') +
      (d.notice ? '<p class="muted" style="font-size:2.2vw">' + esc(d.notice) + '</p>' : '') +
    '</div>' +
    '<div class="call-side">' +
      '<div class="muted">次のご案内</div>' +
      '<div class="next">' + (next.length ? next.map(function (n) { return 'No.' + esc(n.no) + '　' + esc(n.time); }).join('<br>') : '―') + '</div>' +
      '<hr style="border:none;border-top:1px solid var(--line);margin:2vh 0">' +
      (d.open && d.remaining ? '<div class="muted">整理券はこちら（残り ' + d.remaining + ' 枠）</div><div class="qr">' + qrSvg(BOOT.url) + '</div>'
                              : '<div class="next" style="font-size:2.4vw">' + (d.open ? '本日の整理券は終了しました' : '整理券の配布は休止中です') + '</div>') +
      '<div class="muted">' + esc(d.now) + ' 現在</div>' +
    '</div>';
}

// ───────── ポスター ─────────

function renderPoster() {
  $app.innerHTML =
    '<div class="poster-title">' + esc(BOOT.name) + '</div>' +
    (BOOT.subtitle ? '<div class="poster-sub">' + esc(BOOT.subtitle) + '</div>' : '') +
    '<p class="lead">整理券はスマホで取れます</p>' +
    '<div class="qr">' + qrSvg(BOOT.url) + '</div>' +
    '<ol><li>QRコードを読み取る</li><li>人数と時間を選んで「整理券を取る」</li><li>時間になったら入口でスタッフに画面を見せる</li></ol>' +
    '<p style="font-size:18px">スマホをお持ちでない方は、受付のスタッフにお声がけください。</p>' +
    '<p class="url">' + esc(BOOT.url) + '</p>' +
    '<p class="noprint"><button onclick="window.print()">印刷する</button></p>';
}

// ───────── 起動 ─────────

document.body.className = 'page-' + BOOT.page;
if (BOOT.page === 'staff') {
  setInterval(function () { if (A.pin && A.data && !A.walk && !A.issued && !A.busy && !document.hidden) loadStaff(); }, 10000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && A.pin && A.data) loadStaff(); });
  if (A.pin) { renderStaff(); loadStaff(); } else renderLogin('');
} else if (BOOT.page === 'call') {
  every(8000, function () { api('getPublic', '').then(renderCall).catch(function () {}); });
} else if (BOOT.page === 'poster') {
  document.documentElement.style.background = '#fff';
  renderPoster();
} else {
  renderTicket();
  every(15000, loadTicket);
}
</script>
</body>
</html>
